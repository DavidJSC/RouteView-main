<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RouteView – Iniciar Sesión</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/dark-mode.css" />
  <style>
    /* ── Página de login ── */
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 20px 60px;
      background: var(--gris-claro);
    }

    .login-card {
      background: var(--blanco);
      border-radius: var(--radio);
      box-shadow: var(--sombra);
      width: 100%;
      max-width: 460px;
      padding: 40px 36px;
    }

    .login-card .logo-mini {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      margin-bottom: 28px;
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--azul);
      text-decoration: none;
    }
    .login-card .logo-mini img {
      height: 36px;
    }
    .login-card .logo-mini span { color: var(--verde); }

    /* Tabs */
    .tabs {
      display: flex;
      border-bottom: 2px solid var(--gris-medio);
      margin-bottom: 28px;
    }
    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      color: var(--gris-texto);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab-btn.activo {
      color: var(--verde);
      border-bottom-color: var(--verde);
    }

    /* Formularios */
    .tab-panel { display: none; }
    .tab-panel.activo { display: block; }

    .grupo-campo {
      margin-bottom: 18px;
    }
    .grupo-campo label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      color: var(--azul);
      font-size: 0.9rem;
    }
    .grupo-campo input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--gris-medio);
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--azul);
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    .grupo-campo input:focus {
      outline: none;
      border-color: var(--verde);
    }
    .grupo-campo input.campo-error {
      border-color: #dc3545;
    }
    .msg-error-campo {
      color: #dc3545;
      font-size: 0.8rem;
      margin-top: 4px;
      display: block;
      min-height: 16px;
    }

    /* Botón submit */
    .btn-submit {
      width: 100%;
      padding: 13px;
      background: var(--verde);
      color: var(--blanco);
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: #157b5e; }
    .btn-submit:disabled {
      background: var(--gris-medio);
      cursor: not-allowed;
    }

    /* Alertas globales */
    .alerta {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 0.9rem;
      font-weight: 600;
      display: none;
    }
    .alerta.exito {
      background: #d4edda;
      color: #155724;
      display: block;
    }
    .alerta.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }

    /* Spinner dentro del botón */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: girar 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes girar { to { transform: rotate(360deg); } }

    /* Botón invitado en navbar */
    .btn-invitado-nav {
      font-size: 0.88rem !important;
      padding: 8px 20px !important;
    }
    /* Botón invitado (texto) */
    .btn-invitado {
      color: var(--gris-texto);
      font-size: 0.9rem;
      text-decoration: none;
      border-bottom: 1px dashed var(--gris-medio);
      padding-bottom: 2px;
      transition: color 0.2s;
    }
    .btn-invitado:hover { color: var(--azul); }

    /* Estilos navbar auth slot */
    .nav-auth-slot {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav-username {
      color: var(--blanco);
      font-size: 0.9rem;
      font-weight: 600;
    }
    .btn-nav-logout {
      color: var(--gris-texto);
      font-size: 0.85rem;
      text-decoration: none;
      border: 1px solid var(--gris-medio);
      padding: 6px 14px;
      border-radius: 50px;
    }
    .btn-nav-login {
      padding: 8px 20px !important;
      font-size: 0.88rem !important;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header id="navbar">
    <div class="nav-contenido">
      <a href="index.html" class="logo" aria-label="Inicio de RouteView">
        <img src="images/3logo.png" alt="Logo de RouteView">
        Route<span>View</span>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="rutas.html">Rutas</a></li>
          <li><a href="registro.html">Mis Rutas</a></li>
          <li>
            <a href="index.html" class="btn btn-primario btn-invitado-nav">
              Continuar como invitado →
            </a>
          </li>
        </ul>
      </nav>
      <button id="hamburger" class="hamburger" aria-label="Abrir menú"
        aria-expanded="false" aria-controls="menu-movil">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div id="menu-movil" class="menu-movil" role="navigation" aria-label="Menú móvil">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="rutas.html">Rutas</a></li>
        <li><a href="registro.html">Mis Rutas</a></li>
      </ul>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="login-wrapper">
    <div class="login-card">

      <!-- Logo pequeño -->
      <a href="index.html" class="logo-mini">
        <img src="images/3logo.png" alt="RouteView">
        Route<span>View</span>
      </a>

      <!-- Tabs: Login / Registro -->
      <div class="tabs" role="tablist">
        <button class="tab-btn activo" id="tab-login" role="tab"
          aria-selected="true" aria-controls="panel-login">
          Iniciar sesión
        </button>
        <button class="tab-btn" id="tab-registro" role="tab"
          aria-selected="false" aria-controls="panel-registro">
          Crear cuenta
        </button>
      </div>

      <!-- ── Panel: LOGIN ── -->
      <div class="tab-panel activo" id="panel-login" role="tabpanel" aria-labelledby="tab-login">
        <div class="alerta" id="alerta-login" role="alert"></div>

        <div class="grupo-campo">
          <label for="login-email">Correo electrónico</label>
          <input type="email" id="login-email" placeholder="tu@correo.com" autocomplete="email" />
          <span class="msg-error-campo" id="err-login-email"></span>
        </div>

        <div class="grupo-campo">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" />
          <span class="msg-error-campo" id="err-login-password"></span>
        </div>

        <button class="btn-submit" id="btn-login">Ingresar</button>
      </div>

      <!-- ── Panel: REGISTRO ── -->
      <div class="tab-panel" id="panel-registro" role="tabpanel" aria-labelledby="tab-registro">
        <div class="alerta" id="alerta-registro" role="alert"></div>

        <div class="grupo-campo">
          <label for="reg-nombre">Nombre completo</label>
          <input type="text" id="reg-nombre" placeholder="María García" autocomplete="name" />
          <span class="msg-error-campo" id="err-reg-nombre"></span>
        </div>

        <div class="grupo-campo">
          <label for="reg-email">Correo electrónico</label>
          <input type="email" id="reg-email" placeholder="tu@correo.com" autocomplete="email" />
          <span class="msg-error-campo" id="err-reg-email"></span>
        </div>

        <div class="grupo-campo">
          <label for="reg-password">Contraseña</label>
          <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
          <span class="msg-error-campo" id="err-reg-password"></span>
        </div>

        <div class="grupo-campo">
          <label for="reg-confirmar">Confirmar contraseña</label>
          <input type="password" id="reg-confirmar" placeholder="Repetí tu contraseña" autocomplete="new-password" />
          <span class="msg-error-campo" id="err-reg-confirmar"></span>
        </div>

        <button class="btn-submit" id="btn-registro">Crear cuenta</button>
      </div>

    </div>


  </main>

  <script type="module">
    import {
      iniciarSesion,
      registrarUsuario,
      guardarSesion,
      estaAutenticado
    } from './js/auth.js';

    // Si ya está autenticado, redirigir directo
    if (estaAutenticado()) {
      window.location.href = 'registro.html';
    }

    // ── Tabs ────────────────────────────────────────────────────────────────
    const tabLogin    = document.getElementById('tab-login');
    const tabRegistro = document.getElementById('tab-registro');
    const panelLogin    = document.getElementById('panel-login');
    const panelRegistro = document.getElementById('panel-registro');

    tabLogin.addEventListener('click', () => cambiarTab('login'));
    tabRegistro.addEventListener('click', () => cambiarTab('registro'));

    function cambiarTab(cual) {
      const esLogin = cual === 'login';
      tabLogin.classList.toggle('activo', esLogin);
      tabRegistro.classList.toggle('activo', !esLogin);
      tabLogin.setAttribute('aria-selected', esLogin);
      tabRegistro.setAttribute('aria-selected', !esLogin);
      panelLogin.classList.toggle('activo', esLogin);
      panelRegistro.classList.toggle('activo', !esLogin);
      limpiarErrores();
    }

    // ── Helpers ──────────────────────────────────────────────────────────────
    function mostrarAlerta(id, mensaje, tipo) {
      const el = document.getElementById(id);
      el.textContent = mensaje;
      el.className = `alerta ${tipo}`;
    }
    function ocultarAlerta(id) {
      const el = document.getElementById(id);
      el.textContent = '';
      el.className = 'alerta';
    }
    function marcarError(inputId, errId, mensaje) {
      document.getElementById(inputId).classList.add('campo-error');
      document.getElementById(errId).textContent = mensaje;
    }
    function limpiarError(inputId, errId) {
      document.getElementById(inputId).classList.remove('campo-error');
      document.getElementById(errId).textContent = '';
    }
    function limpiarErrores() {
      ['login-email','login-password','reg-nombre','reg-email','reg-password','reg-confirmar']
        .forEach(id => {
          document.getElementById(id)?.classList.remove('campo-error');
        });
      ['err-login-email','err-login-password','err-reg-nombre','err-reg-email',
       'err-reg-password','err-reg-confirmar'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = '';
      });
      ocultarAlerta('alerta-login');
      ocultarAlerta('alerta-registro');
    }
    function setBotonCargando(btnId, cargando, textoOriginal) {
      const btn = document.getElementById(btnId);
      btn.disabled = cargando;
      btn.innerHTML = cargando
        ? `<span class="spinner"></span> Procesando...`
        : textoOriginal;
    }

    // ── Validación LOGIN ─────────────────────────────────────────────────────
    document.getElementById('btn-login').addEventListener('click', async () => {
      limpiarErrores();
      const email    = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      let valido = true;
      if (!email) {
        marcarError('login-email', 'err-login-email', 'El correo es obligatorio');
        valido = false;
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        marcarError('login-email', 'err-login-email', 'Formato de correo inválido');
        valido = false;
      }
      if (!password) {
        marcarError('login-password', 'err-login-password', 'La contraseña es obligatoria');
        valido = false;
      }
      if (!valido) return;

      setBotonCargando('btn-login', true, 'Ingresar');
      try {
        const { token, user } = await iniciarSesion({ email, password });
        guardarSesion(token, user);
        mostrarAlerta('alerta-login', `¡Bienvenido/a, ${user.fullName}!`, 'exito');
        setTimeout(() => { window.location.href = 'registro.html'; }, 1000);
      } catch (err) {
        mostrarAlerta('alerta-login', err.message, 'error');
      } finally {
        setBotonCargando('btn-login', false, 'Ingresar');
      }
    });

    // ── Validación REGISTRO ──────────────────────────────────────────────────
    document.getElementById('btn-registro').addEventListener('click', async () => {
      limpiarErrores();
      const fullName  = document.getElementById('reg-nombre').value.trim();
      const email     = document.getElementById('reg-email').value.trim();
      const password  = document.getElementById('reg-password').value;
      const confirmar = document.getElementById('reg-confirmar').value;

      let valido = true;
      if (!fullName || fullName.length < 2) {
        marcarError('reg-nombre', 'err-reg-nombre', 'Ingresá tu nombre completo');
        valido = false;
      }
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        marcarError('reg-email', 'err-reg-email', 'Correo inválido');
        valido = false;
      }
      if (!password || password.length < 6) {
        marcarError('reg-password', 'err-reg-password', 'Mínimo 6 caracteres');
        valido = false;
      }
      if (password !== confirmar) {
        marcarError('reg-confirmar', 'err-reg-confirmar', 'Las contraseñas no coinciden');
        valido = false;
      }
      if (!valido) return;

      setBotonCargando('btn-registro', true, 'Crear cuenta');
      try {
        await registrarUsuario({ fullName, email, password });
        mostrarAlerta('alerta-registro', '¡Cuenta creada! Ya podés iniciar sesión.', 'exito');
        setTimeout(() => cambiarTab('login'), 1500);
      } catch (err) {
        mostrarAlerta('alerta-registro', err.message, 'error');
      } finally {
        setBotonCargando('btn-registro', false, 'Crear cuenta');
      }
    });

    // ── Enter en campos ──────────────────────────────────────────────────────
    ['login-email','login-password'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('btn-login').click();
      });
    });
    ['reg-nombre','reg-email','reg-password','reg-confirmar'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('btn-registro').click();
      });
    });

    // ── Menú hamburguesa ─────────────────────────────────────────────────────
    const hamburger = document.getElementById('hamburger');
    const menuMovil  = document.getElementById('menu-movil');
    if (hamburger && menuMovil) {
      hamburger.addEventListener('click', () => {
        const abierto = hamburger.getAttribute('aria-expanded') === 'true';
        hamburger.setAttribute('aria-expanded', !abierto);
        menuMovil.classList.toggle('open');
        menuMovil.style.display = menuMovil.classList.contains('open') ? 'block' : 'none';
      });
    }
  </script>
</body>
</html>
