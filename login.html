<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RouteView – Iniciar Sesión</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/dark-mode.css" />
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 20px 60px;
      background: var(--gris-claro);
    }

    .login-card {
      background: var(--blanco);
      border-radius: var(--radio);
      box-shadow: var(--sombra);
      width: 100%;
      max-width: 460px;
      padding: 40px 36px;
    }

    .login-card .logo-mini {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      margin-bottom: 28px;
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--azul);
      text-decoration: none;
    }
    .login-card .logo-mini img { height: 36px; }
    .login-card .logo-mini span { color: var(--verde); }

    /* Tabs */
    .tabs {
      display: flex;
      border-bottom: 2px solid var(--gris-medio);
      margin-bottom: 28px;
    }
    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      color: var(--gris-texto);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab-btn.activo {
      color: var(--verde);
      border-bottom-color: var(--verde);
    }

    .tab-panel { display: none; }
    .tab-panel.activo { display: block; }

    .grupo-campo { margin-bottom: 18px; }
    .grupo-campo label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      color: var(--azul);
      font-size: 0.9rem;
    }
    .grupo-campo input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--gris-medio);
      border-radius: 8px;
      font-size: 1rem;
      color: var(--azul);
      transition: border-color 0.2s;
      background: var(--gris-claro);
    }
    .grupo-campo input:focus {
      outline: none;
      border-color: var(--verde);
      background: var(--blanco);
    }
    .grupo-campo input.error { border-color: #e53e3e; }

    .msg-error {
      color: #e53e3e;
      font-size: 0.82rem;
      margin-top: 4px;
      display: block;
      min-height: 18px;
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background: var(--verde);
      color: var(--blanco);
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s, opacity 0.2s;
    }
    .btn-submit:hover { background: #00a678; }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Alerta */
    .alerta {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 18px;
      display: none;
    }
    .alerta.error   { background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }
    .alerta.exito   { background: #f0fff4; color: #276749; border: 1px solid #9ae6b4; }
    .alerta.visible { display: block; }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header id="navbar">
    <div class="nav-contenido">
      <a href="index.html" class="logo" aria-label="Inicio">
        <img src="images/3logo.png" alt="Logo RouteView">
        Route<span>View</span>
      </a>
      <nav aria-label="Navegación principal">
        <ul class="nav-links">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="rutas.html">Rutas</a></li>
          <li><a href="registro.html">Mis Rutas</a></li>
        </ul>
      </nav>
      <div id="nav-auth-slot"></div>
    </div>
  </header>

  <!-- CONTENIDO -->
  <main class="login-wrapper">
    <div class="login-card">

      <a href="index.html" class="logo-mini">
        <img src="images/3logo.png" alt="Logo">
        Route<span>View</span>
      </a>

      <!-- Tabs -->
      <div class="tabs" role="tablist">
        <button class="tab-btn activo" id="tab-login"    role="tab" aria-selected="true">Iniciar sesión</button>
        <button class="tab-btn"        id="tab-registro" role="tab" aria-selected="false">Crear cuenta</button>
      </div>

      <!-- Panel LOGIN -->
      <div class="tab-panel activo" id="panel-login" role="tabpanel">
        <div class="alerta" id="alerta-login"></div>

        <div class="grupo-campo">
          <label for="login-email">Correo electrónico</label>
          <input type="email" id="login-email" placeholder="tu@correo.com" autocomplete="email" />
          <span class="msg-error" id="err-login-email"></span>
        </div>
        <div class="grupo-campo">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" placeholder="••••••" autocomplete="current-password" />
          <span class="msg-error" id="err-login-password"></span>
        </div>

        <button class="btn-submit" id="btn-login">Ingresar</button>

        <p style="text-align:center; margin-top:18px; font-size:0.9rem; color:var(--gris-texto);">
          ¿No tenés cuenta? <a href="#" id="link-a-registro" style="color:var(--verde); font-weight:bold;">Registrate</a>
        </p>
      </div>

      <!-- Panel REGISTRO -->
      <div class="tab-panel" id="panel-registro" role="tabpanel">
        <div class="alerta" id="alerta-registro"></div>

        <div class="grupo-campo">
          <label for="reg-nombre">Nombre completo</label>
          <input type="text" id="reg-nombre" placeholder="María García" autocomplete="name" />
          <span class="msg-error" id="err-reg-nombre"></span>
        </div>
        <div class="grupo-campo">
          <label for="reg-email">Correo electrónico</label>
          <input type="email" id="reg-email" placeholder="tu@correo.com" autocomplete="email" />
          <span class="msg-error" id="err-reg-email"></span>
        </div>
        <div class="grupo-campo">
          <label for="reg-password">Contraseña <small style="color:var(--gris-texto); font-weight:normal;">(mínimo 6 caracteres)</small></label>
          <input type="password" id="reg-password" placeholder="••••••" autocomplete="new-password" />
          <span class="msg-error" id="err-reg-password"></span>
        </div>
        <div class="grupo-campo">
          <label for="reg-confirmar">Confirmar contraseña</label>
          <input type="password" id="reg-confirmar" placeholder="••••••" autocomplete="new-password" />
          <span class="msg-error" id="err-reg-confirmar"></span>
        </div>

        <button class="btn-submit" id="btn-registro">Crear cuenta</button>

        <p style="text-align:center; margin-top:18px; font-size:0.9rem; color:var(--gris-texto);">
          ¿Ya tenés cuenta? <a href="#" id="link-a-login" style="color:var(--verde); font-weight:bold;">Iniciá sesión</a>
        </p>
      </div>

    </div>
  </main>

  <script type="module">
    import {
      registrarUsuario,
      iniciarSesion,
      guardarSesion,
      estaAutenticado,
      actualizarNavbar
    } from './js/auth.js';

    // Si ya está autenticado, redirigir
    if (estaAutenticado()) window.location.href = 'perfil.html';

    actualizarNavbar();

    // ── Tabs ─────────────────────────────────────────────────────────────────
    function cambiarTab(tab) {
      const esLogin = tab === 'login';
      document.getElementById('tab-login').classList.toggle('activo', esLogin);
      document.getElementById('tab-registro').classList.toggle('activo', !esLogin);
      document.getElementById('panel-login').classList.toggle('activo', esLogin);
      document.getElementById('panel-registro').classList.toggle('activo', !esLogin);
      limpiarErrores();
      ocultarAlertas();
    }

    document.getElementById('tab-login').addEventListener('click', () => cambiarTab('login'));
    document.getElementById('tab-registro').addEventListener('click', () => cambiarTab('registro'));
    document.getElementById('link-a-registro').addEventListener('click', (e) => { e.preventDefault(); cambiarTab('registro'); });
    document.getElementById('link-a-login').addEventListener('click', (e) => { e.preventDefault(); cambiarTab('login'); });

    // ── Helpers UI ───────────────────────────────────────────────────────────
    function marcarError(inputId, errorId, mensaje) {
      document.getElementById(inputId)?.classList.add('error');
      const el = document.getElementById(errorId);
      if (el) el.textContent = mensaje;
    }

    function limpiarErrores() {
      document.querySelectorAll('.grupo-campo input').forEach(i => i.classList.remove('error'));
      document.querySelectorAll('.msg-error').forEach(e => e.textContent = '');
    }

    function mostrarAlerta(id, mensaje, tipo) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = mensaje;
      el.className = `alerta ${tipo} visible`;
    }

    function ocultarAlertas() {
      document.querySelectorAll('.alerta').forEach(a => a.className = 'alerta');
    }

    function setBtnCargando(id, cargando, textoOriginal) {
      const btn = document.getElementById(id);
      btn.disabled = cargando;
      btn.textContent = cargando ? 'Cargando...' : textoOriginal;
    }

    // ── LOGIN ─────────────────────────────────────────────────────────────────
    // Llama a: Endpoint 2 → POST accounts:signInWithPassword
    document.getElementById('btn-login').addEventListener('click', async () => {
      limpiarErrores();
      ocultarAlertas();
      const email    = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      let valido = true;

      if (!email) { marcarError('login-email', 'err-login-email', 'El correo es obligatorio'); valido = false; }
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { marcarError('login-email', 'err-login-email', 'Formato de correo inválido'); valido = false; }
      if (!password) { marcarError('login-password', 'err-login-password', 'La contraseña es obligatoria'); valido = false; }
      if (!valido) return;

      setBtnCargando('btn-login', true, 'Ingresar');
      try {
        const data = await iniciarSesion({ email, password });
        guardarSesion(data.idToken, { fullName: data.displayName, email: data.email, uid: data.localId });
        mostrarAlerta('alerta-login', `¡Bienvenido/a, ${data.displayName || email}!`, 'exito');
        setTimeout(() => window.location.href = 'perfil.html', 1000);
      } catch (err) {
        mostrarAlerta('alerta-login', err.message, 'error');
      } finally {
        setBtnCargando('btn-login', false, 'Ingresar');
      }
    });

    // ── REGISTRO ──────────────────────────────────────────────────────────────
    // Llama a: Endpoint 1 → POST accounts:signUp
    document.getElementById('btn-registro').addEventListener('click', async () => {
      limpiarErrores();
      ocultarAlertas();
      const fullName  = document.getElementById('reg-nombre').value.trim();
      const email     = document.getElementById('reg-email').value.trim();
      const password  = document.getElementById('reg-password').value;
      const confirmar = document.getElementById('reg-confirmar').value;
      let valido = true;

      if (!fullName || fullName.length < 2) { marcarError('reg-nombre', 'err-reg-nombre', 'Ingresá tu nombre completo'); valido = false; }
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { marcarError('reg-email', 'err-reg-email', 'Correo inválido'); valido = false; }
      if (!password || password.length < 6) { marcarError('reg-password', 'err-reg-password', 'Mínimo 6 caracteres'); valido = false; }
      if (password !== confirmar) { marcarError('reg-confirmar', 'err-reg-confirmar', 'Las contraseñas no coinciden'); valido = false; }
      if (!valido) return;

      setBtnCargando('btn-registro', true, 'Crear cuenta');
      try {
        await registrarUsuario({ fullName, email, password });
        mostrarAlerta('alerta-registro', '✓ ¡Cuenta creada! Ya podés iniciar sesión.', 'exito');
        setTimeout(() => cambiarTab('login'), 1800);
      } catch (err) {
        mostrarAlerta('alerta-registro', err.message, 'error');
      } finally {
        setBtnCargando('btn-registro', false, 'Crear cuenta');
      }
    });

    // Enter en campos
    ['login-email', 'login-password'].forEach(id =>
      document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btn-login').click(); })
    );
    ['reg-nombre', 'reg-email', 'reg-password', 'reg-confirmar'].forEach(id =>
      document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btn-registro').click(); })
    );
  </script>
</body>
</html>
